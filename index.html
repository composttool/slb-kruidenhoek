<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadslandbouw Arnhem - Compost & Kruiden Beheer</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --bg-color: #f4f6f4;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 8px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
            padding: 0 5px;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 15px;
            border-radius: var(--border-radius);
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 { margin: 0 0 5px 0; font-size: 1.5rem; }
        header p { margin: 0; opacity: 0.9; font-size: 0.85rem; }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--primary-dark);
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        /* Zoekfunctie & Registratie Styling */
        .search-box-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 180px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .search-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: auto;
            margin-top: 0;
        }

        .search-btn:hover { background-color: var(--primary-dark); }

        .search-results {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.9rem;
            display: none;
        }

        .search-feedback {
            margin-top: 10px;
            padding: 10px;
            background: #e8f5e9;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
            margin-top: 15px;
        }
        button:hover { background-color: var(--primary-dark); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Stadslandbouw Arnhem</h1>
        <p>Compost & Kruiden Zoekmodule</p>
    </header>

    <!-- Nieuwe Kruiden Zoek- en Registratie Card -->
    <div class="card">
        <h2>🌿 Kruiden Zoeken & Registreren</h2>
        <p style="font-size: 0.9rem; color: #666;">Typ direct om live te zoeken. Staat het kruid er niet tussen? Klik op de zoekknop om uw invoer automatisch te registreren voor aanvulling:</p>
        
        <div class="search-box-container">
            <input type="text" id="kruidSearchInput" class="search-input" placeholder="Typ kruidsoorten (bijv. Tijm, Munt)...">
            <button type="button" id="kruidSearchBtn" class="search-btn">🔍 Zoek / Registreer</button>
        </div>

        <div id="searchResults" class="search-results"></div>
        <div id="searchFeedback" class="search-feedback"></div>
    </div>

</div>

<script>
    // Jouw unieke Google Apps Script Web App URL voor centrale synchronisatie
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxqDLa2yAw2RL_XYewi5UzRCq71lBW4ZZsNLqIBSOlGzT4JaXDi7PQ_c8I6GFK0N3zgng/exec";

    // Voorbeeld database van bekende kruiden (of haal dit uit je centrale dataset)
    const bekendeKruiden = [
        { naam: "Tijm", vak: "Vak A", functie: "Bodembedekker / Culinair" },
        { naam: "Munt", vak: "Vak B", functie: "Thee / Sterk woekerend" },
        { naam: "Rozemarijn", vak: "Vak A", functie: "Heester / Medicinaal" },
        { naam: "Salie", vak: "Vak C", functie: "Geneeskrachtig" }
    ];

    document.addEventListener('DOMContentLoaded', function() {
        const input = document.getElementById('kruidSearchInput');
        const btn = document.getElementById('kruidSearchBtn');
        const resultsBox = document.getElementById('searchResults');
        const feedbackBox = document.getElementById('searchFeedback');

        // Live zoeken tijdens typen
        input.addEventListener('input', function() {
            const query = input.value.trim().toLowerCase();
            feedbackBox.style.display = 'none';

            if (query.length === 0) {
                resultsBox.style.display = 'none';
                return;
            }

            const matches = bekendeKruiden.filter(k => k.naam.toLowerCase().includes(query) || k.functie.toLowerCase().includes(query));
            
            if (matches.length > 0) {
                resultsBox.style.display = 'block';
                resultsBox.innerHTML = matches.map(m => `<div><strong>${m.naam}</strong> (${m.vak}) - ${m.functie}</div>`).join('<hr style="margin:5px 0; border:0; border-top:1px solid #ddd;">');
            } else {
                resultsBox.style.display = 'block';
                resultsBox.innerHTML = `<em>Geen direct resultaat in de lijst. Klik op 'Zoek / Registreer' om toe te voegen.</em>`;
            }
        });

        // Actie bij klikken op de zoek-/registratieknop (ook als er geen Enter is gebruikt)
        btn.addEventListener('click', function() {
            const query = input.value.trim();
            if (!query) {
                alert("Typ eerst een kruidnaam in.");
                return;
            }

            const matches = bekendeKruiden.filter(k => k.naam.toLowerCase().includes(query.toLowerCase()));

            if (matches.length > 0) {
                resultsBox.style.display = 'block';
                resultsBox.innerHTML = matches.map(m => `<div><strong>${m.naam}</strong> (${m.vak}) - ${m.functie}</div>`).join('');
                feedbackBox.style.display = 'none';
            } else {
                resultsBox.style.display = 'none';
                feedbackBox.style.display = 'block';
                feedbackBox.innerHTML = `🔍 Geen direct resultaat gevonden voor '<strong>${query}</strong>'. Uw zoekopdracht is geregistreerd, we gaan dit kruid binnenkort toevoegen aan de database!`;

                // Verstuur naar Google Apps Script backend
                stuurGemisteZoekopdrachtNaarSheet(query);
            }
        });
    });

    async function stuurGemisteZoekopdrachtNaarSheet(zoekterm) {
        try {
            let payload = {
                action: "gemisteZoekopdracht",
                namedValues: {
                    kruidsoort: zoekterm,
                    timestamp: new Date().toISOString()
                }
            };

            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ action: "gemisteZoekopdracht", kruidsoort: zoekterm })
            });
        } catch (e) {
            console.error("Fout bij verzenden gemiste zoekopdracht:", e);
        }
    }
</script>

</body>
</html>
